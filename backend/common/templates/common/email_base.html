<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{{ title|default:site_name }}</title>
</head>
<body style="margin:0; padding:0; background:#f4f6fb; font-family:Arial, Helvetica, sans-serif; color:#182f5b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 24px rgba(24,47,91,0.08);">
                    <tr>
                        <td style="background:#ffffff; padding:20px 32px; border-bottom:1px solid #eef0f5;">
                            <img src="{{ logo_url }}" alt="{{ site_name }}" height="40" style="display:block; height:40px; width:auto;" />
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px;">
                            <p style="margin:24px 0 0; font-size:13px; line-height:1.6; color:#5a6b85;">
                                Questions? Email <a href="mailto:{{ support_email }}" style="color:#00bcd4; text-decoration:none; font-weight:600;">{{ support_email }}</a>.
                            </p>
                            <p style="margin:8px 0 0; font-size:13px; line-height:1.6; color:#5a6b85;">
                                — The {{ site_name }} Team
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
